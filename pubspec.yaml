name: healthmate
description: Offline personal health and wellness tracker.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.10.0
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  sqflite: ^2.4.2
  path: ^1.9.1
  intl: ^0.20.2
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
dependency_overrides:
  # 2.5.0's JNI registrar fails at runtime on the app's Android build.
  shared_preferences_android: 2.4.27
flutter:
  uses-material-design: true
